      <stop offset="0" stop-color="#5CC2FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5CC2FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="500" fill="#000000"/>
  <ellipse cx="760" cy="250" rx="360" ry="260" fill="url(#glow)"/>

