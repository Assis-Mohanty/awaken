# Test-only Wrangler config for @cloudflare/vitest-plugin (vitest.config.ts). Miniflare simulates Durable Objects
# and D1 fully locally, so tests get the REAL RateLimiter/BudgetCounter/REPORTS_DB behaviour. Workers AI and the
# `ratelimits` binding have no local simulation — they proxy to the real Cloudflare API even for `wrangler dev`/
# tests, which would require CLOUDFLARE_API_TOKEN — so this config omits both; tests inject plain mock objects
# for `env.AI` and `env.IP_RATE_LIMITER` instead (see test/helpers.ts).
name = "awaken-path-oracle-test"
main = "src/index.ts"
compatibility_date = "2026-10-20"

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
AI_MODEL_ID = "@cf/google/gemma-4-26b-a4b-it"
AI_PRICE_PER_1K_TOKENS_USD = "0.0004"
ENVIRONMENT = "staging"
MONTHLY_BUDGET_USD = "1"
DEBUG_KEY = "test-debug-key"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "BUDGET_COUNTER"
class_name = "BudgetCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "BudgetCounter"]

[[d1_databases]]
binding = "REPORTS_DB"
database_name = "awaken-path-oracle-reports-test"
database_id = "test-local-only"
migrations_dir = "migrations"
