# The Path Oracle (ARCH §3.8). One Worker, three routes, no server to patch.
# `wrangler dev` runs this base config against local/simulated bindings.
# Real traffic always goes through [env.staging] or [env.production] — see README.md for the one-time setup
# (D1 database, Durable Object migration, Play Integrity service-account secret, debug key).
name = "awaken-path-oracle"
main = "src/index.ts"
compatibility_date = "2026-10-20"

# Lets the Worker `import SYSTEM_PROMPT from "../prompts/plan_path.v1.md"` as a plain string (bundled by esbuild).
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Workers AI: the LLM backend. No API key — it's billed to this Cloudflare account via its own free/paid tiers.
[ai]
binding = "AI"

# Model used for both PLAN_PATH and WEEK_QUESTS; must support `response_format: { type: "json_schema" }` (verify
# against https://developers.cloudflare.com/workers-ai/features/json-mode/ before changing — the catalog changes).
[vars]
AI_MODEL_ID = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# PLACEHOLDER: Workers AI bills in "neurons", not tokens, and env.AI.run() doesn't return a per-call neuron
# count — only token usage is confirmed in the response — so BudgetCounter approximates spend from tokens.
# Replace this with AI_MODEL_ID's actual $/1k-token rate from
# https://developers.cloudflare.com/workers-ai/platform/pricing/ before trusting the monthly cap.
AI_PRICE_PER_1K_TOKENS_USD = "0.01"
ENVIRONMENT = "development"
MONTHLY_BUDGET_USD = "1"

# Per-install and per-IP abuse limits (GD §6.6.7), implemented as Durable Objects so counters are strongly
# consistent even under concurrent requests from the same install.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "BUDGET_COUNTER"
class_name = "BudgetCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "BudgetCounter"]

# Per-IP backstop (GD §6.6.7 "global"), a sliding-window binding Cloudflare operates itself — separate from the
# per-install Durable Object above.
[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 30
period = 60

# "Report this quest" storage (ARCH §3.8): the only thing the proxy stores, 90-day TTL via the cron below.
[[d1_databases]]
binding = "REPORTS_DB"
database_name = "awaken-path-oracle-reports"
database_id = "REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT"

# Daily sweep that deletes reports past their TTL (D1 has no native row TTL).
[triggers]
crons = ["0 3 * * *"]

# ---- Environments ---------------------------------------------------------------------------------------------
# durable_objects / d1_databases / ratelimits bindings are NOT inherited by environments; each one repeats them.

[env.staging]
name = "awaken-path-oracle-staging"

[env.staging.ai]
binding = "AI"

[env.staging.vars]
AI_MODEL_ID = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_PRICE_PER_1K_TOKENS_USD = "0.01"
ENVIRONMENT = "staging"
MONTHLY_BUDGET_USD = "5"

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.staging.durable_objects.bindings]]
name = "BUDGET_COUNTER"
class_name = "BudgetCounter"

[[env.staging.ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1002"
[env.staging.ratelimits.simple]
limit = 30
period = 60

[[env.staging.d1_databases]]
binding = "REPORTS_DB"
database_name = "awaken-path-oracle-reports-staging"
database_id = "c527c3a1-d1d7-4ee5-a124-52a3d1978215"

[env.staging.triggers]
crons = ["0 3 * * *"]

[env.production]
name = "awaken-path-oracle"

[env.production.ai]
binding = "AI"

[env.production.vars]
AI_MODEL_ID = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_PRICE_PER_1K_TOKENS_USD = "0.01"
ENVIRONMENT = "production"
MONTHLY_BUDGET_USD = "20"

[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.production.durable_objects.bindings]]
name = "BUDGET_COUNTER"
class_name = "BudgetCounter"

[[env.production.ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1003"
[env.production.ratelimits.simple]
limit = 30
period = 60

[[env.production.d1_databases]]
binding = "REPORTS_DB"
database_name = "awaken-path-oracle-reports-production"
database_id = "REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT"

[env.production.triggers]
crons = ["0 3 * * *"]
